apiVersion: 1

# Grafana has no built-in Twilio notifier, so the SMS goes out through a webhook.
# Point TWILIO_WEBHOOK_URL at a relay that turns the POST body into a Twilio
# message, or at Twilio's own Messages endpoint behind a proxy that adds the
# Basic auth header. The relay is three lines of Flask; keep the credentials
# there, never in this file.
contactPoints:
  - orgId: 1
    name: threshold-sms
    receivers:
      - uid: threshold-sms-webhook
        type: webhook
        disableResolveMessage: false
        settings:
          url: ${TWILIO_WEBHOOK_URL}
          httpMethod: POST
          title: 'THRESHOLD ALERT: {{ .CommonLabels.site }}'
          message: |
            THRESHOLD ALERT: {{ .CommonLabels.site }} is above the ordinance limit in force.
            {{ range .Alerts }}Level {{ .ValueString }}. Mitigation is at maximum. Please respond.
            {{ end }}

policies:
  - orgId: 1
    receiver: threshold-sms
    group_by: [alertname, site]
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 30m
    routes:
      - receiver: threshold-sms
        object_matchers:
          - ["severity", "=", "critical"]
        repeat_interval: 15m
